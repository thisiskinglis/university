function render(filter="", faculty="all", letter="all"){
  const list = document.getElementById("studentList");
  let filtered = students;
  if(faculty!=="all") filtered = filtered.filter(s=>s.faculty===faculty);
  if(filter) filtered = filtered.filter(s=>s.name.toLowerCase().includes(filter.toLowerCase()) || s.qual.toLowerCase().includes(filter.toLowerCase()));
  if(letter!=="all") filtered = filtered.filter(s=>s.name.startsWith(letter));
  
  const grouped = {};
  filtered.forEach(s=>{ const l=s.name[0]; if(!grouped[l]) grouped[l]=[]; grouped[l].push(s); });
  
  let html="";
  Object.keys(grouped).sort().forEach(l=>{
    html+= `<div class="bg-[#001F3A] text-white px-4 py-2 font-bold sticky top-0">${l} — ${grouped[l].length} students</div>`;
    grouped[l].forEach(s=>{
      html+= `<div class="grid grid-cols-[260px_1fr_120px] gap-4 p-3 border-b text-[13px] hover:bg-[#f8fafc]"><div class="font-semibold">${s.name}</div><div class="text-gray-600">${s.qual}</div><div><span class="bg-gray-100 px-2 py-1 rounded text-[11px]">${s.faculty}</span></div></div>`;
    });
  });
  if(!filtered.length) html=`<div class="p-8 text-center text-gray-500">No students found</div>`;
  list.innerHTML=html;
}
const alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const nav = document.getElementById("alphaNav");
nav.innerHTML = `<button data-l="all" class="alpha-btn alpha-active px-2 py-1 text-[12px] border rounded">All</button>` + alpha.map(l=>`<button data-l="${l}" class="alpha-btn px-2 py-1 text-[12px] border rounded hover:bg-gray-100">${l}</button>`).join("");
let currentLetter="all";
nav.addEventListener("click", e=>{
  if(e.target.classList.contains("alpha-btn")){
    document.querySelectorAll(".alpha-btn").forEach(b=>b.classList.remove("alpha-active"));
    e.target.classList.add("alpha-active");
    currentLetter=e.target.dataset.l;
    render(document.getElementById("search").value, document.getElementById("facultyFilter").value, currentLetter);
  }
});
document.getElementById("search").addEventListener("input", e=>render(e.target.value, document.getElementById("facultyFilter").value, currentLetter));
document.getElementById("facultyFilter").addEventListener("change", e=>render(document.getElementById("search").value, e.target.value, currentLetter));
render();
